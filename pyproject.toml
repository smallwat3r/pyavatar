[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyavatar"
dynamic = ["version"]
description = "Generate simple user avatars from an input string."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthieu Petiteau", email = "mpetiteau.pro@gmail.com" }]
keywords = ["avatar"]
requires-python = ">=3.10"
dependencies = ["Pillow>=10.3.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
svg = ["fonttools>=4.40.0"]
dev = [
    "build",
    "fonttools",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "yapf",
]

[project.urls]
Homepage = "https://github.com/smallwat3r/pyavatar"

[tool.setuptools]
packages = ["pyavatar"]

[tool.setuptools.dynamic]
version = { attr = "pyavatar._version.__version__" }

[tool.setuptools.package-data]
pyavatar = ["font/*.ttf", "py.typed"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]

[tool.yapf]
split_before_logical_operator = true
allow_multiline_dictionary_keys = true
allow_split_before_default_or_named_assigns = true
allow_split_before_dict_value = true
blank_line_before_nested_class_or_def = true
coalesce_brackets = true
column_limit = 79
disable_ending_comma_heuristic = true
each_dict_entry_on_separate_line = true
indent_dictionary_value = true
indent_closing_brackets = false
join_multiple_lines = false
spaces_before_comment = 2
split_all_comma_separated_values = false
split_all_top_level_comma_separated_values = true
split_before_dict_set_generator = true
split_before_dot = true
split_complex_comprehension = true

[tool.coverage.report]
fail_under = 80
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:"
]

[tool.coverage.run]
source = ["pyavatar"]
